services:

  # ── MySQL 8 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: inseoul-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: inseoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 백엔드 ───────────────────────────────────────
  spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile.build
    container_name: inseoul-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/inseoul?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-inseoul-prod-secret-change-me-256bits-long}
      OAUTH2_REDIRECT_URI: ${FRONTEND_URL:-http://localhost}
      MOLIT_API_KEY: ${MOLIT_API_KEY:-}
      CHATBOT_URL: http://fastapi:8000
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      LOGGING_LEVEL_COM_INSEOUL: INFO
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI 챗봇 ─────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend-chatbot
    container_name: inseoul-fastapi
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_PERSIST_DIR: /app/vectorstore
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    volumes:
      - fastapi-vectorstore:/app/vectorstore
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ── Nginx 리버스 프록시 ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: inseoul-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - spring
      - fastapi

volumes:
  mysql-data:
  fastapi-vectorstore:
