name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: 프론트엔드 빌드 ─────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Job 2: Spring 빌드 (테스트 제외) ──────────────────────────
  build-spring:
    name: Build Spring Boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build JAR
        working-directory: backend-spring
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-jar
          path: backend-spring/build/libs/*.jar
          retention-days: 1

  # ── Job 3: Spring 유닛 테스트 (H2) ────────────────────────────
  test-spring:
    name: Spring Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        working-directory: backend-spring
        run: ./gradlew test --no-daemon

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-test-report
          path: backend-spring/build/reports/tests/test/
          retention-days: 7

  # ── Job 4: FastAPI 도커 빌드 ───────────────────────────────────
  build-fastapi:
    name: Build FastAPI Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t inseoul-fastapi ./backend-chatbot

  # ── Job 5: 통합 테스트 (docker compose + API 스모크) ──────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-frontend, build-spring, test-spring, build-fastapi]
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          DB_USERNAME=root
          DB_PASSWORD=ci-test-password
          JWT_SECRET=ci-jwt-secret-for-testing-must-be-32chars!!
          FRONTEND_URL=http://localhost
          MOLIT_API_KEY=
          OPENAI_API_KEY=
          KAKAO_CLIENT_ID=dummy-kakao
          KAKAO_CLIENT_SECRET=dummy-kakao-secret
          GOOGLE_CLIENT_ID=dummy-google
          GOOGLE_CLIENT_SECRET=dummy-google-secret
          ALLOWED_ORIGINS=http://localhost
          EOF

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for Spring to be healthy
        run: |
          echo "Waiting for Spring Boot..."
          for i in $(seq 1 18); do
            if curl -sf http://localhost:8080/api/health 2>/dev/null | grep -q '"db":"UP"'; then
              echo "Spring is healthy"
              break
            fi
            echo "  attempt $i/18..."
            sleep 5
            if [ "$i" -eq 18 ]; then
              echo "Spring failed to become healthy"
              docker compose logs spring
              exit 1
            fi
          done

      - name: Wait for FastAPI to be healthy
        run: |
          echo "Waiting for FastAPI..."
          for i in $(seq 1 6); do
            if curl -sf http://localhost:8000/health 2>/dev/null | grep -q '"status"'; then
              echo "FastAPI is healthy"
              break
            fi
            echo "  attempt $i/6..."
            sleep 5
            if [ "$i" -eq 6 ]; then
              echo "FastAPI failed to become healthy"
              docker compose logs fastapi
              exit 1
            fi
          done

      - name: Run API smoke tests
        run: bash scripts/ci-smoke-test.sh

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
