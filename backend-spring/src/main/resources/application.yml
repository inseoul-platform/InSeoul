spring:
  application:
    name: inseoul
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:inseoul-dev-secret-key-must-be-at-least-256bits-long-for-hs256}
    access-expiry-minutes: 15
    refresh-expiry-days: 7
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173}

molit:
  api-key: ${MOLIT_API_KEY:}

chatbot:
  url: ${CHATBOT_URL:http://127.0.0.1:8000}

logging:
  level:
    com.inseoul: DEBUG
    org.mybatis: DEBUG
