spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inseoul?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-here}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret-here}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: openid, profile_nickname
            client-name: Kakao
            client-authentication-method: client_secret_post
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-here}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-here}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope: email, profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            user-name-attribute: sub

logging:
  level:
    com.inseoul: DEBUG
    org.mybatis: DEBUG
    org.flywaydb: DEBUG
